 if(group){$('groups').innerHTML=['beforeWords','afterWords'].map((k,j)=>`<section class="group-side ${j?'after':''}"><h2>${j?'调整后':'调整前'} · ${esc(title(x.unit))}</h2>${x[k].map((g,n)=>`<div class="group-row"><h3>第 ${n+1} 组</h3><div class="tags">${g.map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div></div>`).join('')}</section>`).join('');$('rule').textContent=`保留原选定的 15 个词与原图，分为 3 组，每组 5 个。${x.movedCards} 个词调整所在组，减轻同一组场景混淆。`;return}
 $('before').src=x.before;$('after').src=x.after;$('thumbnail').src=x.after;$('before').style.objectFit=x.beforeX!==x.afterX?'cover':'contain';$('after').style.objectFit=x.beforeX!==x.afterX?'cover':'contain';$('before').style.objectPosition=x.beforeX+'% 50%';for(const id of ['after','thumbnail'])$(id).style.objectPosition=x.afterX+'% 50%';$('before-note').textContent=x.beforeNote;$('method').textContent=x.method;$('after-label').textContent=mode==='keep'?'复核后保留':'修改后';$('where').textContent=title(x.unit)+' · '+x.auditId;$('word').textContent=x.word;$('definition').textContent=x.definition;$('sentence').textContent=x.example;$('cue').textContent=x.cue;$('lesson').href=x.href;const changed=x.example!==x.oldExample;$('example-change').classList.toggle('hidden',!changed);$('example-change').textContent=changed?'校本例句已校正用义。原句：'+x.oldExample:'';$('rule').textContent='依据完整例句核对词义与关系；保留有效图片，只针对问题调整。缩略图须在实际五图组中可辨。';history.replaceState(null,'','#'+encodeURIComponent(x.key));}
$('mode').onchange=filter;$('unit').onchange=filter;$('item').onchange=()=>{index=Number($('item').value);render()};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<list.length-1){index++;render()}};document.addEventListener('keydown',e=>{if(['SELECT','INPUT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click()});let initial=decodeURIComponent(location.hash.slice(1));filter();if(initial){let n=list.findIndex(x=>x.key===initial);if(n>=0){index=n;render()}}
</script></body></html>
