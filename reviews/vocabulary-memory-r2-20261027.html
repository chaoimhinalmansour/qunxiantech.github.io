function selectList(){list=$('unit').value==='all'?REVIEW.cases:REVIEW.cases.filter(c=>c.unit===$('unit').value);index=0;$('item').replaceChildren(...list.map((c,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=c.unitLabel+' · '+c.word;return o;}));render();}
for(const [unit,label]of [...new Map(REVIEW.cases.map(c=>[c.unit,c.unitLabel]))]){const o=document.createElement('option');o.value=unit;o.textContent=label;$('unit').append(o);}
$('unit').addEventListener('change',selectList);$('item').addEventListener('change',()=>{index=Number($('item').value);render();});$('prev').addEventListener('click',()=>{index=(index+list.length-1)%list.length;render();});$('next').addEventListener('click',()=>{index=(index+1)%list.length;render();});$('blind').addEventListener('click',()=>{const on=document.body.classList.toggle('blind');$('blind').textContent=on?'显示词义与前后对照':'只看新图，隐藏释义';render();});document.addEventListener('keydown',e=>{if(e.target.matches('select'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click();});selectList();window.REVIEW_R2=REVIEW;
