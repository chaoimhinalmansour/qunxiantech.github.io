<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>题目素材关联图</title><style>body{margin:0;background:#f3f5f8;color:#19304b;font-family:Arial,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:28px auto;padding:26px;background:#fff}p,li{line-height:1.7}a{color:#193c78}table{width:100%;border-collapse:collapse}td,th{padding:11px;border:1px solid #d8dee8;text-align:left;vertical-align:top;line-height:1.6}th{background:#edf3fc}img{max-width:100%}select,input,button{font:inherit;padding:9px}nav{display:flex;flex-wrap:wrap;gap:15px}.relation-row{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:start}.task{position:relative;border:2px solid #294778;padding:18px;border-radius:8px}.task:after{content:"";position:absolute;right:-53px;top:35px;width:51px;border-top:2px solid #294778}.resources{display:grid;gap:14px}.resource{position:relative;border:1px solid #b5c5da;padding:16px;border-radius:8px}.resource:before{content:"";position:absolute;left:-26px;top:35px;width:25px;border-top:2px solid #294778}.shared{display:flex;gap:8px;flex-wrap:wrap}.shared a{padding:5px;border:1px solid #c3d0e3;border-radius:5px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}#exercise{grid-column:1/-1}small{color:#5b6e85}@media(max-width:750px){main{margin:0;padding:15px}.relation-row{grid-template-columns:1fr;gap:20px}.task:after,.resource:before{display:none}.tools{grid-template-columns:1fr}table{font-size:13px}}</style><main><nav><a href="../index.html">返回课件库</a><a href="题目素材功能核对.html">核对记录</a></nav><h1>题目素材关联图</h1><p>查看原题所需的图片、文章、音视频、其他原题及教材参考页，以及哪些原题共用这些材料。点击材料可直接打开对应课件和材料。数量包含原题在不同课堂阶段的使用记录。</p><div class="tools"><select id="lesson" aria-label="课件"></select><input id="search" placeholder="搜索原题指令或标题"><select id="exercise" aria-label="原题"></select></div><div id="graph"></div></main><script src="../assets/exercise-relations.js?v=20261010-position-v8"></script><script>
const data=window.SCHOOL_RELATIONS,L=document.querySelector('#lesson'),E=document.querySelector('#exercise'),Q=document.querySelector('#search'),root=document.querySelector('#graph');
const text=(tag,t,cls)=>{const e=document.createElement(tag);e.textContent=t;if(cls)e.className=cls;return e};const label=e=>(e.source_kind==='existing supplement'?'补充练习':'Ex. '+e.number)+' · '+e.section+' · '+e.titles.join(' · ').replaceAll('|',' · ');const url=(e,r)=>'../lessons/'+L.value+'.html?v=20261010-position-v8#page='+e.pages[0]+'&exercise='+e.number+(r?'&material='+r.id:'');
for(const key of Object.keys(data))L.append(new Option(key.replaceAll('_',' '),key));
function options(){E.replaceChildren();for(const e of data[L.value].exercises){if(Q.value&&!((e.canonical+' '+label(e)).toLowerCase().includes(Q.value.toLowerCase())))continue;E.append(new Option(label(e),e.id))}draw()}
function draw(){root.replaceChildren();const g=data[L.value],e=g.exercises.find(e=>e.id===E.value);if(!e){root.append(text('p','未找到对应题目。'));return}const row=text('div','','relation-row'),task=text('section','','task');task.append(text('h2',label(e)),text('p',e.canonical),text('small','教材页码：'+(e.book_pages.join(', ')||'见原题来源')));const link=text('a','打开原题');link.href=url(e);link.target='_blank';task.append(document.createElement('br'),link);row.append(task);const rs=text('div','','resources');for(const rid of e.resources){const r=g.resources[rid],card=text('section','','resource'),a=text('a',r.label);a.href=url(e,r);a.target='_blank';card.append(a);if(r.photos)card.append(text('p','原图 '+r.photos.length+' 张：'+r.photos.map(p=>p.label||'原图').join(', ')));if(r.bookImages)card.append(text('p','教材原页 '+r.bookImages.map(p=>p.book_page).join(', ')));const shared=g.exercises.filter(x=>x.id!==e.id&&x.resources.includes(rid));if(shared.length){card.append(text('h3','共用此材料的原题'));const links=text('div','','shared');for(const x of shared){const b=text('a',label(x));b.href=url(x,r);b.target='_blank';links.append(b)}card.append(links)}rs.append(card)}if(!e.resources.length)rs.append(text('p',e.student_supplied_material?'本题按原指令由学生提供材料。':'本题所需内容在题面中。'));row.append(rs);root.append(row)}
L.onchange=options;Q.oninput=options;E.onchange=draw;options();
</script></html>
